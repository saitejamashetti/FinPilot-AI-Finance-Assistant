{% extends 'base.html' %}

{% block title %}Register | FinPilot{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="brand-mark mx-auto mb-3">F</div>
            <h1>Create account</h1>
            <p class="text-muted">Start your smarter financial journey.</p>
        </div>

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input type="text" class="form-control" name="fullname" value="{{ fullname or '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" value="{{ email or '' }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" minlength="12" maxlength="128" autocomplete="new-password" placeholder="At least 12 characters" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">Already registered? <a href="{{ url_for('auth.login') }}">Login here</a></small>
        </div>
    </div>
</div>
{% endblock %}
