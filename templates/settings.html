{% extends 'base.html' %}

{% block title %}Settings | FinPilot{% endblock %}
{% block page_title %}Settings{% endblock %}

{% block content %}
<div class="panel-card" style="max-width: 700px; margin: 0 auto;">
    <h4>Preferences</h4>
    <form method="POST" class="mt-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label class="form-label">Theme</label>
            <select class="form-select" name="theme">
                <option value="light" {% if theme == 'light' %}selected{% endif %}>Light mode</option>
                <option value="dark" {% if theme == 'dark' %}selected{% endif %}>Dark mode</option>
            </select>
        </div>
        <button class="btn btn-primary" type="submit">Save preferences</button>
    </form>
</div>
{% endblock %}
