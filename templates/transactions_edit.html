{% extends 'base.html' %}

{% block title %}Edit transaction | FinPilot{% endblock %}
{% block page_title %}Edit transaction{% endblock %}

{% block content %}
<div class="panel-card" style="max-width: 720px;">
    <h4>Edit transaction</h4>
    <form method="POST" class="mt-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Description</label>
                <input type="text" class="form-control" name="description" value="{{ transaction.description }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Amount</label>
                <input type="number" step="0.01" class="form-control" name="amount" value="{{ transaction.amount }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Type</label>
                <select class="form-select" name="type">
                    <option value="expense" {% if transaction.type == 'expense' %}selected{% endif %}>Expense</option>
                    <option value="income" {% if transaction.type == 'income' %}selected{% endif %}>Income</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Category</label>
                <select class="form-select" name="category">
                    {% for category in ['Food', 'Transport', 'Shopping', 'Bills', 'Entertainment', 'Health', 'Education', 'Other'] %}
                    <option value="{{ category }}" {% if transaction.category == category %}selected{% endif %}>{{ category }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Date</label>
                <input type="date" class="form-control" name="date" value="{{ transaction.date }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Merchant</label>
                <input type="text" class="form-control" name="merchant" value="{{ transaction.merchant or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Payment method</label>
                <input type="text" class="form-control" name="payment_method" value="{{ transaction.payment_method or '' }}">
            </div>
        </div>

        <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="{{ url_for('transactions.transactions') }}" class="btn btn-outline-secondary">Back</a>
        </div>
    </form>
</div>
{% endblock %}
